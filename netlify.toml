# For later: hosting the client on Netlify with the game server on Render.
# In Netlify's site settings, set the environment variable
#   VITE_SERVER_URL = https://<your-render-service>.onrender.com
# and on Render set CLIENT_ORIGIN to your Netlify URL.
[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
